name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk shahar-words.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shahar-words
          path: shahar-words.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: shahar-words.apk
          # Only the main branch becomes "latest" (what the in-app updater offers). Other branches are test builds.
          prerelease: ${{ github.ref_name != 'claude/project-thread-65ep8k' }}
          make_latest: ${{ github.ref_name == 'claude/project-thread-65ep8k' }}
