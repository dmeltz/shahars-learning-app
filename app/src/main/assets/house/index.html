<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; min-height: 200px; overflow: hidden; background: transparent; touch-action: none; user-select: none; -webkit-user-select: none; font-family: sans-serif; }
  canvas { display: block; touch-action: none; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 220px; background: #fff; color: #3A2A4D; font-weight: bold; font-size: 15px;
    padding: 8px 12px; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.18); direction: rtl; text-align: center; white-space: normal; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
  #buttons { position: fixed; left: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
  #buttons button { width: 46px; height: 46px; border-radius: 14px; border: 0; background: rgba(255,255,255,.88); font-size: 22px; box-shadow: 0 2px 5px rgba(0,0,0,.2); padding: 0; }
</style>
</head>
<body>
<div id="msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#3A2A4D;font-size:16px;font-weight:bold;direction:rtl">טוען את הבית... 🏠</div>
<div id="overlay"></div>
<div id="buttons"></div>
<script>
  // If anything goes wrong, show it on screen and tell the app, so it is easy to find.
  function houseError(m) {
    var el = document.getElementById('msg');
    el.style.display = 'flex';
    el.textContent = 'הבית לא נטען 😕 ' + m;
    try { window.Android && Android.onError(String(m)); } catch (e) {}
  }
  window.onerror = function (m, src, line) { houseError(m + ' (' + line + ')'); };
</script>
<script src="house.js"></script>
</body>
</html>
